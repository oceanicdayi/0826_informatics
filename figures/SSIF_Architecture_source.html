<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<title>SSIF Architecture (ML style)</title>
<style>
  @page { size: 9.375in 14.6in; margin: 0; }
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  * { box-sizing: border-box; }
  svg { display: block; }
  text { font-family: Arial, Helvetica, "Liberation Sans", sans-serif; }

  .stage-box { fill: #FFFFFF; stroke: #1B1E23; stroke-width: 2; }
  .sub-box   { fill: #F2F3F5; stroke: #6B7280; stroke-width: 1.4; }

  .title-lg   { font-size: 27px; font-weight: 800; fill: #111418; letter-spacing: -0.01em; }
  .title-md   { font-size: 23px; font-weight: 800; fill: #111418; }
  .param-line { font-size: 13px; fill: #5B6472; }
  .box-title  { font-size: 18.5px; font-weight: 700; fill: #111418; }
  .box-num    { font-size: 20px; font-weight: 800; fill: #111418; }
  .box-formula{ font-size: 15px; font-weight: 700; fill: #111418; }
  .tag-sm     { font-size: 11.5px; fill: #5B6472; font-weight: 600; }
  .shape-lbl  { font-size: 13.5px; fill: #3B4250; font-style: italic; }
  .legend-lbl { font-size: 12.5px; fill: #5B6472; }

  .conn-line     { stroke: #1B1E23; stroke-width: 2.2; fill: none; }
  .conn-arrow    { stroke: #1F5C8B; stroke-width: 2.4; fill: none; }
  .residual-line { stroke: #8A93A0; stroke-width: 1.4; fill: none; stroke-dasharray: 4,3; opacity: 0.9; }
  .bracket-line  { stroke: #3B4250; stroke-width: 1.5; fill: none; }

  .seq-bar      { fill: #1F5C8B; }
  .seq-missing  { stroke: #97A0AC; stroke-width: 1.8; stroke-dasharray: 2,2; }
  .seq-baseline { stroke: #C7CDD5; stroke-width: 1; }

  .mk-ink   { fill: #1B1E23; }
  .mk-blue  { fill: #1F5C8B; }
  .mk-maroon{ fill: #8A3324; }

  .junction-dot { fill: #1F5C8B; }
</style>
</head>
<body>

<svg viewBox="0 0 900 1400" width="900" height="1400" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="SSIF architecture, machine-learning diagram style: two-channel 1 Hz input passes through a 3-layer convolutional stem (2 to 96 to 192 to 192 channels), a learnable positional embedding is added, a 4-layer pre-norm Transformer with masked self-attention and feed-forward sublayers processes the sequence, masked mean-pooling produces a 192-d vector, and two linear heads output a 10-class softmax and a binary sigmoid alert.">

  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk-ink" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path class="mk-blue" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-maroon" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path class="mk-maroon" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#F5ECE9"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#8A3324" stroke-width="1.4" opacity="0.55"/>
    </pattern>

    <g id="seq-glyph">
      <line x1="-6" y1="0" x2="322" y2="0" class="seq-baseline"/>
      <rect class="seq-bar" x="0"   y="-14" width="10" height="14" rx="1.5"/>
      <rect class="seq-bar" x="18"  y="-22" width="10" height="22" rx="1.5"/>
      <rect class="seq-bar" x="36"  y="-4"  width="10" height="4"  rx="1"/>
      <rect class="seq-bar" x="54"  y="-44" width="10" height="44" rx="1.5"/>
      <line class="seq-missing" x1="77" y1="0" x2="77" y2="-10"/>
      <rect class="seq-bar" x="90"  y="-52" width="10" height="52" rx="1.5"/>
      <rect class="seq-bar" x="108" y="-38" width="10" height="38" rx="1.5"/>
      <rect class="seq-bar" x="126" y="-26" width="10" height="26" rx="1.5"/>
      <rect class="seq-bar" x="144" y="-34" width="10" height="34" rx="1.5"/>
      <line class="seq-missing" x1="167" y1="0" x2="167" y2="-10"/>
      <rect class="seq-bar" x="180" y="-58" width="10" height="58" rx="1.5"/>
      <rect class="seq-bar" x="198" y="-66" width="10" height="66" rx="1.5"/>
      <rect class="seq-bar" x="216" y="-50" width="10" height="50" rx="1.5"/>
      <line class="seq-missing" x1="239" y1="0" x2="239" y2="-10"/>
      <rect class="seq-bar" x="252" y="-24" width="10" height="24" rx="1.5"/>
      <rect class="seq-bar" x="270" y="-18" width="10" height="18" rx="1.5"/>
      <rect class="seq-bar" x="288" y="-12" width="10" height="12" rx="1.5"/>
      <rect class="seq-bar" x="306" y="-8"  width="10" height="8"  rx="1.5"/>
    </g>
  </defs>

  <!-- ===== LEGEND ===== -->
  <text x="60" y="32" class="legend-lbl" letter-spacing="0.05em">DATA FLOW &#8595;</text>
  <rect x="480" y="23" width="16" height="10" fill="#1F5C8B" rx="1.5"/>
  <text x="502" y="32" class="legend-lbl">valid</text>
  <line x1="600" y1="33" x2="600" y2="23" class="seq-missing"/>
  <text x="612" y="32" class="legend-lbl">masked</text>

  <!-- ===================================================== -->
  <!-- STAGE A — INPUT                                        -->
  <!-- ===================================================== -->
  <rect x="60" y="50" width="780" height="170" rx="10" class="stage-box"/>
  <text x="80" y="84" class="title-lg">Input</text>
  <text x="80" y="108" class="param-line">2 channels &middot; T = 10&ndash;40 s (5 s steps)</text>
  <use href="#seq-glyph" transform="translate(292,196)"/>

  <line x1="450" y1="220" x2="450" y2="253" class="conn-line" marker-end="url(#arrow-ink)"/>
  <text x="470" y="240" class="shape-lbl">[B, 2, T]</text>

  <!-- ===================================================== -->
  <!-- STAGE B — CONVOLUTIONAL STEM                           -->
  <!-- ===================================================== -->
  <rect x="60" y="260" width="780" height="170" rx="10" class="stage-box"/>
  <text x="80" y="294" class="title-lg">Conv Stem &times;3</text>
  <text x="80" y="318" class="param-line">GroupNorm(8) &middot; GELU &middot; Dropout</text>

  <rect x="100" y="330" width="190" height="80" rx="8" class="sub-box"/>
  <text x="195" y="363" text-anchor="middle" class="box-title">Conv1D k3</text>
  <text x="195" y="393" text-anchor="middle" class="box-num">2 &rarr; 96</text>
  <line x1="290" y1="370" x2="345" y2="370" class="conn-line" marker-end="url(#arrow-ink)"/>

  <rect x="355" y="330" width="190" height="80" rx="8" class="sub-box"/>
  <text x="450" y="363" text-anchor="middle" class="box-title">Conv1D k3</text>
  <text x="450" y="393" text-anchor="middle" class="box-num">96 &rarr; 192</text>
  <line x1="545" y1="370" x2="600" y2="370" class="conn-line" marker-end="url(#arrow-ink)"/>

  <rect x="610" y="330" width="190" height="80" rx="8" class="sub-box"/>
  <text x="705" y="363" text-anchor="middle" class="box-title">Conv1D k3</text>
  <text x="705" y="393" text-anchor="middle" class="box-num">192 &rarr; 192</text>

  <!-- connector B -> C, positional-embedding merge -->
  <line x1="450" y1="430" x2="450" y2="495" class="conn-line" marker-end="url(#arrow-ink)"/>
  <text x="405" y="470" text-anchor="end" class="shape-lbl">[B,192,T]</text>
  <circle cx="450" cy="465" r="8" fill="#FFFFFF" stroke="#1B1E23" stroke-width="1.75"/>
  <text x="450" y="470" text-anchor="middle" class="box-title" font-size="15">+</text>
  <line x1="580" y1="465" x2="464" y2="465" class="conn-line" marker-end="url(#arrow-ink)"/>
  <rect x="580" y="445" width="220" height="40" rx="8" class="sub-box"/>
  <text x="690" y="470" text-anchor="middle" class="box-formula">+ Pos. Embed</text>

  <!-- ===================================================== -->
  <!-- STAGE C — TRANSFORMER ENCODER                          -->
  <!-- ===================================================== -->
  <rect x="60" y="500" width="780" height="370" rx="10" class="stage-box"/>
  <text x="80" y="534" class="title-lg">Transformer &times;4</text>
  <text x="80" y="558" class="param-line">h=4 &middot; d=192 &middot; d_ff=384 &middot; pre-norm</text>

  <path d="M100,612 C300,576 600,576 800,612" class="residual-line"/>
  <circle cx="800" cy="612" r="6" class="junction-dot"/>
  <rect x="100" y="580" width="700" height="64" rx="8" class="sub-box"/>
  <text x="450" y="618" text-anchor="middle" class="box-title">Multi-Head Self-Attn &nbsp;(masked)</text>

  <path d="M100,700 C300,664 600,664 800,700" class="residual-line"/>
  <circle cx="800" cy="700" r="6" class="junction-dot"/>
  <rect x="100" y="668" width="700" height="64" rx="8" class="sub-box"/>
  <text x="450" y="706" text-anchor="middle" class="box-title">Feed-Forward</text>

  <path d="M90,580 L82,580 L82,732 L90,732" class="bracket-line" fill="none"/>
  <text x="67" y="656" text-anchor="middle" class="box-title" font-size="15" transform="rotate(-90 67 656)">&times;4</text>

  <use href="#seq-glyph" transform="translate(292,828)"/>
  <text x="450" y="844" text-anchor="middle" class="tag-sm">excluded from attention</text>

  <line x1="450" y1="870" x2="450" y2="903" class="conn-line" marker-end="url(#arrow-ink)"/>
  <text x="470" y="893" class="shape-lbl">[B,192,T]</text>

  <!-- ===================================================== -->
  <!-- STAGE D — MASKED MEAN-POOLING                          -->
  <!-- ===================================================== -->
  <rect x="60" y="910" width="780" height="220" rx="10" class="stage-box"/>
  <text x="80" y="944" class="title-lg">Masked Mean-Pool</text>
  <text x="80" y="968" class="param-line">valid steps only</text>

  <use href="#seq-glyph" transform="translate(292,1056)"/>
  <line x1="450" y1="1066" x2="450" y2="1090" class="conn-arrow" marker-end="url(#arrow-blue)"/>
  <rect x="405" y="1090" width="90" height="30" rx="7" fill="#E9F0F5" stroke="#1F5C8B" stroke-width="1.5"/>
  <text x="450" y="1111" text-anchor="middle" class="box-formula" fill="#1F5C8B">[B,192]</text>

  <line x1="450" y1="1130" x2="450" y2="1163" class="conn-line" marker-end="url(#arrow-ink)"/>

  <!-- ===================================================== -->
  <!-- STAGE E — MULTITASK OUTPUT HEADS                       -->
  <!-- ===================================================== -->
  <rect x="60" y="1170" width="780" height="200" rx="10" class="stage-box"/>
  <text x="80" y="1198" class="title-md">Output Heads</text>

  <circle cx="450" cy="1220" r="6.5" class="junction-dot"/>
  <line x1="450" y1="1220" x2="272" y2="1260" class="conn-arrow" marker-end="url(#arrow-blue)"/>
  <line x1="450" y1="1220" x2="628" y2="1260" stroke="#8A3324" stroke-width="2.4" marker-end="url(#arrow-maroon)"/>

  <rect x="100" y="1260" width="320" height="90" rx="9" fill="#EDF2F6" stroke="#6B7280" stroke-width="1.4"/>
  <rect x="100" y="1260" width="6" height="90" fill="#1F5C8B"/>
  <text x="124" y="1292" class="box-title">Class Head</text>
  <text x="124" y="1316" class="box-formula">Linear &rarr; Softmax(10)</text>
  <text x="124" y="1336" class="tag-sm">CWA intensity : 0,1,2,3,4,5&minus;,5+,6&minus;,6+,7</text>

  <rect x="480" y="1260" width="320" height="90" rx="9" fill="url(#hatch)" stroke="#6B7280" stroke-width="1.4"/>
  <rect x="480" y="1260" width="6" height="90" fill="#8A3324"/>
  <text x="504" y="1292" class="box-title">Alert Head</text>
  <text x="504" y="1316" class="box-formula">Linear &rarr; Sigmoid(1)</text>
  <text x="504" y="1336" class="tag-sm">I &ge; 4</text>

</svg>

</body>
</html>
